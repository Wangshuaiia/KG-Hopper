[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kghopper"
version = "0.1.0"
description = "KG-Hopper core: KG tool, rollout and reward shared by training and evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["kghopper*"]
